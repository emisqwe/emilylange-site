# Pages CMS editor setup (app.pagescms.org). This file decides what the editor shows.
media:
  input: src/images
  output: /images
  categories: [image]

content:
  - name: projects
    label: Projects
    type: collection
    path: content/projects
    format: json
    filename: "{primary}.json"
    view:
      fields: [title, section, order, published]
      primary: title
      sort: [section, order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Project name
        type: string
        required: true
      - name: slug
        label: Web address
        type: string
        required: true
        description: "The end of the link, e.g. hera makes emilylange.com/work/hera. Lowercase, no spaces. Don't change it after the page is live."
      - name: section
        label: Home page section
        type: select
        default: Work
        options:
          values: [Work, Self-launched]
      - name: order
        label: Position within its section
        type: number
        description: "1 shows first. Use whole numbers."
      - name: published
        label: Show on site
        type: boolean
        default: true
      - name: has_page
        label: Has its own case study page
        type: boolean
        default: true
        description: "Turn off for projects that only link out to a live site."
      - name: coming_soon
        label: Content coming soon
        type: boolean
        default: false
        description: "Turn on for a project you just wrapped. Shows a short note on the home page and hides the case study until you turn it off."
      - name: coming_soon_text
        label: Coming soon note
        type: string
        description: "Optional. Leave empty for: Just wrapped this one. Hold on tight, the full story is coming soon."
      - name: live_url
        label: Live site link
        type: string
        description: "Optional. Shows a Visit site button. If the project has no case study page, its card links here."
      - name: live_label
        label: Live site link text
        type: string
        description: "e.g. Play today’s round. Leave empty for Visit site."
      - name: summary
        label: Home page summary
        type: text
        description: "One or two sentences shown under the project's image on the home page."
      - name: cover
        label: Cover image
        type: image
        description: "Shown on the home page (cropped to 16:9) and at the top of the project page. 1500px or wider."
      - name: cover_alt
        label: Cover image description
        type: string
        description: "What the image shows, for screen readers."
      - name: intro
        label: Intro paragraph
        type: rich-text
        options:
          format: markdown
      - name: duration
        label: Duration
        type: string
        description: "e.g. Summer 2023. Leave empty to hide."
      - name: role
        label: Role
        type: string
        description: "Leave empty to hide."
      - name: links
        label: Buttons
        type: object
        list: true
        description: "Optional buttons under the intro, like a live site or prototype."
        fields:
          - name: label
            label: Button text
            type: string
          - name: url
            label: Link
            type: string
      - name: body
        label: Case study
        type: rich-text
        options:
          format: markdown
        description: "Tip: put a line of italic text right after an image and it becomes that image's caption."

  - name: site
    label: Home page & site details
    type: file
    path: content/site.json
    format: json
    fields:
      - name: name
        label: Your name
        type: string
      - name: description
        label: Search engine description
        type: text
      - name: headline
        label: Home page headline
        type: text
      - name: intro
        label: Home page intro (left column)
        type: rich-text
        options:
          format: markdown
      - name: intro_aside
        label: Home page side notes (right column)
        type: rich-text
        options:
          format: markdown
        description: "Currently, previously, and self-launched projects. Short paragraphs work best."
      - name: work_heading
        label: Work section heading
        type: string
      - name: self_heading
        label: Self-launched section heading
        type: string
      - name: about_heading
        label: About section heading
        type: string
      - name: about_photo
        label: About photo
        type: image
      - name: about_photo_alt
        label: About photo description
        type: string
      - name: about
        label: About text
        type: rich-text
        options:
          format: markdown
      - name: clients_heading
        label: Worked with heading
        type: string
      - name: clients
        label: Clients and collaborators
        type: text
        description: "Separate names with commas. Leave empty to hide."
      - name: education_heading
        label: Education heading
        type: string
      - name: education
        label: Education
        type: object
        list: true
        fields:
          - name: name
            label: School or program
            type: string
          - name: link
            label: Link (optional)
            type: string
          - name: detail
            label: City and year
            type: string
      - name: contact_heading
        label: Contact section heading
        type: string
      - name: contact_intro
        label: Contact intro
        type: rich-text
        options:
          format: markdown
      - name: audit_heading
        label: Free audit heading
        type: string
      - name: audit_text
        label: Free audit offer
        type: rich-text
        options:
          format: markdown
        description: "Leave empty to hide the free audit box."
      - name: form_button
        label: Send button text
        type: string
      - name: form_key
        label: Contact form key (Web3Forms)
        type: string
        description: "Get a free key at web3forms.com by entering the email where messages should arrive. Paste it here."
      - name: email
        label: Email
        type: string
      - name: linkedin
        label: LinkedIn link
        type: string
      - name: resume_url
        label: Resume link
        type: string
